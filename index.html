<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Skoczek: 10 Światów</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#16213A;--white:#fff;--gold:#FFC93C;--pink:#FF4F8B;--green:#3DDC84;--glass:rgba(22,33,58,.7);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--glass:rgba(10,14,28,.82)}}
:root[data-theme="dark"]{--glass:rgba(10,14,28,.82)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#8fd3ff;touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--white)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#wrap{position:relative;width:100%;height:100%}
canvas#c{display:block;width:100%;height:100%}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.pills{display:flex;gap:6px;flex-wrap:wrap;max-width:78%}
.pill{background:var(--glass);border-radius:14px;padding:6px 12px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.pill i{width:11px;height:11px;border-radius:3px;display:inline-block}
.btn-pause{pointer-events:auto;background:var(--glass);border:0;color:#fff;border-radius:12px;width:40px;height:34px;font:800 15px "Nunito";cursor:pointer}
.banner{position:absolute;left:50%;top:20%;transform:translate(-50%,0) scale(.7);text-align:center;opacity:0;transition:opacity .2s,transform .3s cubic-bezier(.2,1.6,.4,1);pointer-events:none;width:92%}
.banner.show{opacity:1;transform:translate(-50%,0) scale(1)}
.banner b{display:block;font:400 clamp(34px,8.5vw,64px)/1 "Lilita One";color:var(--white);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill}
.banner small{display:inline-block;margin-top:8px;font-weight:800;font-size:15px;background:var(--glass);padding:5px 12px;border-radius:10px}
.flash{position:absolute;inset:0;background:#ff3b5c;opacity:0;pointer-events:none;transition:opacity .35s}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(22,33,58,.5)}
.overlay.hide{display:none}
.card{background:#fff;color:var(--ink);border-radius:26px;padding:22px 18px 20px;max-width:440px;width:100%;text-align:center;box-shadow:0 10px 0 var(--ink);border:3px solid var(--ink);max-height:100%;overflow:auto}
.card h1,.card h2{font:400 clamp(36px,10vw,52px)/.92 "Lilita One",sans-serif;margin:0 0 8px}
.card h1 span{display:block;color:var(--pink)}
.card p{margin:0 0 12px;font-size:15px;line-height:1.45;color:#46506A;font-weight:700}
.tabs{display:flex;gap:8px;justify-content:center;margin:4px 0 12px}
.tab{font:400 18px "Lilita One";border:3px solid var(--ink);border-radius:14px;padding:6px 16px;background:#fff;color:var(--ink);cursor:pointer}
.tab.on{background:var(--ink);color:#fff}
.total{font:800 14px "Nunito";color:#6B7590;margin-bottom:8px}
.total b{color:var(--ink)}
.levels{display:flex;flex-direction:column;gap:9px}
.lv{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--ink);border-radius:16px;padding:9px 12px;cursor:pointer;background:#fff;color:var(--ink);font:inherit;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.lv:focus-visible,.play:focus-visible,.btn-pause:focus-visible,.tab:focus-visible,.sw:focus-visible,.hat:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.lv .sq{width:44px;height:44px;border-radius:12px;flex:none;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font:400 22px "Lilita One";color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.lv .tx{flex:1;min-width:0}
.lv .tx b{display:block;font:400 19px/1.1 "Lilita One"}
.lv .tx small{font-size:13px;color:#6B7590;font-weight:700}
.lv .st{font-size:17px;letter-spacing:1px;white-space:nowrap;color:#D5D9E3}
.lv .st .on{color:var(--gold);-webkit-text-stroke:1px var(--ink)}
.lv.locked{opacity:.45;cursor:not-allowed;box-shadow:none}
.lbl{font-weight:800;font-size:14px;margin:10px 0 8px;color:var(--ink)}
.swatches{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:11px;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:var(--ink);transform:translateY(-3px)}
.hats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.hat{border:3px solid var(--ink);border-radius:14px;padding:10px 8px;background:#fff;color:var(--ink);font:400 18px "Lilita One";cursor:pointer}
.hat small{display:block;font:800 12px "Nunito";color:#6B7590}
.hat.on{background:var(--gold)}
.hat.locked{opacity:.45;cursor:not-allowed}
.stars{font-size:46px;letter-spacing:6px;margin:4px 0 10px;color:#D5D9E3}
.stars .on{color:var(--gold);-webkit-text-stroke:2px var(--ink);display:inline-block;animation:pop .4s backwards}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.why{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;text-align:left;font-size:14px;font-weight:700;color:#46506A;margin:0 auto 16px;width:max-content;max-width:100%}
.why b{color:var(--ink)}
.btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.play{font:400 24px "Lilita One",sans-serif;background:var(--green);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:10px 26px;cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s;min-width:230px}
.play.alt{background:#fff;font-size:20px}
.play:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.code{display:flex;gap:8px;justify-content:center;margin-top:14px}
.code input{width:120px;font:400 20px "Lilita One";text-align:center;border:3px solid var(--ink);border-radius:12px;padding:6px;color:var(--ink);letter-spacing:4px}
.code input:focus-visible{outline:3px solid var(--pink)}
.code button{font:400 18px "Lilita One";border:3px solid var(--ink);border-radius:12px;padding:6px 14px;background:var(--gold);color:var(--ink);cursor:pointer}
.codeMsg{font:800 13px "Nunito";margin-top:6px;min-height:18px}
.hint{margin-top:12px;font-size:13px;color:#6B7590;line-height:1.5;font-weight:700}
.joy{position:absolute;left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(22,33,58,.28);border:3px solid rgba(255,255,255,.6);display:none;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.92);border:3px solid var(--ink)}
.jump{position:absolute;right:22px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:94px;height:94px;border-radius:50%;display:none;background:var(--gold);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);font:400 20px "Lilita One";color:var(--ink);touch-action:none}
.jump.down{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.touch .joy,.touch .jump{display:block}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="flash" id="flash"></div>
  <div class="hud">
    <div class="pills">
      <div class="pill" id="pName">Świat 1</div>
      <div class="pill" id="pTime">0:00.0</div>
      <div class="pill"><i style="background:var(--gold);border-radius:50%"></i><span id="pCoins">0/0</span></div>
      <div class="pill"><i style="background:var(--pink)"></i><span id="pDeaths">0</span></div>
    </div>
    <button class="btn-pause" id="pauseBtn" aria-label="Pauza">II</button>
  </div>
  <div class="banner" id="banner"><b id="bT"></b><small id="bS"></small></div>
  <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
  <button class="jump" id="jumpBtn" aria-label="Skok">Skok</button>

  <div class="overlay" id="menu"><div class="card">
    <h1>Skoczek<span>10 Światów</span></h1>
    <div class="tabs"><button class="tab on" id="tabLv">Światy</button><button class="tab" id="tabSkin">Postać</button></div>
    <div id="paneLv">
      <div class="total" id="total"></div>
      <div class="levels" id="levels"></div>
      <div class="code"><input id="codeIn" inputmode="numeric" maxlength="8" placeholder="kod" aria-label="Kod"><button id="codeBtn">OK</button></div>
      <div class="codeMsg" id="codeMsg"></div>
      <div class="hint" id="hint"></div>
    </div>
    <div id="paneSkin" style="display:none">
      <p>Kliknij kolor i nakrycie głowy. Ludzik w tle od razu się zmieni.</p>
      <div class="lbl">Kolor koszulki</div>
      <div class="swatches" id="swatches"></div>
      <div class="lbl">Na głowę</div>
      <div class="hats" id="hats"></div>
    </div>
  </div></div>
  <div class="overlay hide" id="pause"><div class="card">
    <h2>Pauza</h2><p>Platformy czekają.</p>
    <div class="btns"><button class="play" id="resumeBtn">Graj dalej</button><button class="play alt" id="restartBtn">Od nowa</button><button class="play alt" id="skipBtn" style="display:none">Pomiń świat (kod)</button><button class="play alt" id="menuBtn">Wybór świata</button></div>
  </div></div>
  <div class="overlay hide" id="win"><div class="card">
    <h2 id="wT">Ukończone</h2>
    <div class="stars" id="wStars"></div>
    <div class="why" id="wWhy"></div>
    <div class="btns"><button class="play" id="nextBtn">Następny świat</button><button class="play alt" id="againBtn">Jeszcze raz</button><button class="play alt" id="menuBtn2">Wybór świata</button></div>
  </div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const isTouch = ('ontouchstart' in window) || matchMedia('(pointer: coarse)').matches;
  if (isTouch) document.body.classList.add('touch');
  $('hint').textContent = isTouch
    ? 'Joystick to ruch, żółty przycisk to skok (w powietrzu drugi raz). Przeciągnij palcem, żeby obrócić kamerę.'
    : 'WASD: ruch. Spacja: skok i podwójny skok. Mysz: kamera. R: checkpoint. P: pauza.';

  // ---------- audio ----------
  let AC = null;
  function tone(f, d, type = 'square', v = 0.045, slide = 0) {
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
      o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d);
    } catch (e) {}
  }
  const SFX = {
    jump: () => tone(300, 0.14, 'square', 0.035, 300), djump: () => tone(500, 0.16, 'triangle', 0.05, 500),
    coin: () => { tone(988, 0.07); setTimeout(() => tone(1319, 0.14), 60); },
    pad: () => tone(200, 0.35, 'sawtooth', 0.05, 700), boing: () => tone(260, 0.25, 'sine', 0.08, 380),
    cp: () => [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'triangle', 0.06), i * 90)),
    die: () => tone(260, 0.4, 'sawtooth', 0.06, -200), crack: () => tone(120, 0.2, 'triangle', 0.06, -60),
    slam: () => tone(70, 0.3, 'sawtooth', 0.06, -30), land: () => tone(150, 0.06, 'triangle', 0.03),
    win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.16, 'square', 0.05), i * 120)),
    tick: (hi) => tone(hi ? 1046 : 784, 0.05, 'square', 0.025), click: () => tone(660, 0.05, 'square', 0.03)
  };

  // ---------- three ----------
  const canvas = $('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x8fd3ff, 50, 160);
  const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 900);
  const hemi = new THREE.HemisphereLight(0xffffff, 0x7a9cc6, 0.7); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -0.0005;
  Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 110 });
  scene.add(sun, sun.target);
  function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();

  // sky dome (vertex gradient, recolored per level)
  const skyGeo = new THREE.SphereGeometry(700, 32, 16);
  skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(skyGeo.attributes.position.count * 3), 3));
  const sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
  scene.add(sky);
  function setSky(topHex, horHex) {
    const top = new THREE.Color(topHex), hor = new THREE.Color(horHex), col = skyGeo.attributes.color, pos = skyGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) { const y = pos.getY(i) / 700, c = hor.clone().lerp(top, Math.pow(Math.max(0, y), 0.55)); col.setXYZ(i, c.r, c.g, c.b); }
    col.needsUpdate = true; scene.fog.color.set(horHex);
  }

  const tc = document.createElement('canvas'); tc.width = tc.height = 64;
  const tx = tc.getContext('2d');
  tx.fillStyle = '#fff'; tx.fillRect(0, 0, 64, 64);
  tx.fillStyle = 'rgba(0,0,0,.06)'; tx.fillRect(0, 62, 64, 2); tx.fillRect(62, 0, 2, 64);
  tx.fillStyle = 'rgba(255,255,255,1)'; tx.beginPath(); tx.arc(32, 31, 14, 0, 7); tx.fill();
  tx.strokeStyle = 'rgba(0,0,0,.12)'; tx.lineWidth = 3; tx.beginPath(); tx.arc(32, 33, 14, 0.2, Math.PI - 0.2); tx.stroke();
  const studTex = new THREE.CanvasTexture(tc); studTex.wrapS = studTex.wrapT = THREE.RepeatWrapping;
  function studTx(w, d) { const t = studTex.clone(); t.needsUpdate = true; t.repeat.set(Math.max(1, w / 1.2), Math.max(1, d / 1.2)); return t; }

  // ---------- avatar ----------
  const avatar = new THREE.Group();
  const skin = new THREE.MeshStandardMaterial({ color: 0xffd34d, roughness: 0.6 }), shirt = new THREE.MeshStandardMaterial({ color: 0x4f9dff, roughness: 0.6 }), pants = new THREE.MeshStandardMaterial({ color: 0x2b3a5c });
  const mk = (w, h, d, m, x, y, z, p = avatar) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); b.castShadow = true; p.add(b); return b; };
  const piv = (x, y) => { const p = new THREE.Group(); p.position.set(x, y, 0); avatar.add(p); return p; };
  const legs = [piv(-0.2, 0.75), piv(0.2, 0.75)], arms = [piv(-0.55, 1.45), piv(0.55, 1.45)];
  legs.forEach(p => mk(0.36, 0.75, 0.4, pants, 0, -0.375, 0, p)); arms.forEach(p => mk(0.3, 0.72, 0.36, skin, 0, -0.33, 0, p));
  mk(0.8, 0.75, 0.42, shirt, 0, 1.12, 0); mk(0.55, 0.5, 0.5, skin, 0, 1.78, 0);
  const eyeM = new THREE.MeshBasicMaterial({ color: 0x16213a });
  mk(0.08, 0.12, 0.02, eyeM, -0.12, 1.82, 0.26); mk(0.08, 0.12, 0.02, eyeM, 0.12, 1.82, 0.26); mk(0.22, 0.05, 0.02, eyeM, 0, 1.68, 0.26);
  const hatG = new THREE.Group(); avatar.add(hatG);
  function buildHat(kind) {
    while (hatG.children.length) hatG.remove(hatG.children[0]);
    if (kind === 'cap') { const m = new THREE.MeshStandardMaterial({ color: 0xff4f8b }); mk(0.6, 0.2, 0.6, m, 0, 2.12, 0, hatG); mk(0.5, 0.06, 0.35, m, 0, 2.04, 0.38, hatG); }
    if (kind === 'crown') { const m = new THREE.MeshStandardMaterial({ color: 0xffc93c, metalness: 0.6, roughness: 0.3, emissive: 0x553300, emissiveIntensity: 0.4 }); mk(0.6, 0.18, 0.6, m, 0, 2.12, 0, hatG); [[-0.22, -0.22], [0.22, -0.22], [-0.22, 0.22], [0.22, 0.22], [0, 0.22]].forEach(([x, z]) => mk(0.12, 0.2, 0.12, m, x, 2.3, z, hatG)); }
    if (kind === 'halo') { const r = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.06, 8, 24), new THREE.MeshStandardMaterial({ color: 0xfff3a0, emissive: 0xffe066, emissiveIntensity: 1 })); r.rotation.x = Math.PI / 2; r.position.y = 2.35; hatG.add(r); }
    if (kind === 'ears') { const m = new THREE.MeshStandardMaterial({ color: 0xff9a3c }); mk(0.15, 0.3, 0.1, m, -0.2, 2.15, 0, hatG); mk(0.15, 0.3, 0.1, m, 0.2, 2.15, 0, hatG); }
  }
  scene.add(avatar);
  const blob = new THREE.Mesh(new THREE.CircleGeometry(0.55, 24), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35, depthWrite: false }));
  blob.rotation.x = -Math.PI / 2; scene.add(blob);

  // ---------- level system ----------
  let LG = null;
  let solids = [], movers = [], vanish = [], beats = [], spinners = [], fires = [], coins = [], cps = [], convs = [], parts = [], decorAnim = [], winds = [], crushers = [], bubbles = [];
  let finishSolid = null, L = null, levelIdx = 0;

  const shade = (hex, k) => new THREE.Color(hex).multiplyScalar(k);
  function addMesh(geo, m, x, y, z, parent = LG) { const me = new THREE.Mesh(geo, m); me.position.set(x, y, z); me.castShadow = true; me.receiveShadow = true; parent.add(me); return me; }
  let palI = 0;
  const B = {
    plat(x, top, z, w, d, opt = {}) {
      const h = opt.h || 1;
      let mesh;
      if (opt.mat) { mesh = addMesh(new THREE.BoxGeometry(w, h, d), opt.mat, x, top - h / 2, z); }
      else {
        const color = opt.color ?? L.pal[(palI++) % L.pal.length];
        mesh = new THREE.Group(); mesh.position.set(x, top - h / 2, z); LG.add(mesh);
        const topM = new THREE.MeshStandardMaterial({ color, roughness: L.ice ? 0.15 : 0.7, metalness: L.ice ? 0.2 : 0, map: studTx(w, d) });
        const sideM = new THREE.MeshStandardMaterial({ color: shade(color, L.sideShade ?? 0.68), roughness: 0.85 });
        if (L.neon) { topM.emissive = new THREE.Color(color); topM.emissiveIntensity = 0.35; sideM.emissive = shade(color, 0.4); sideM.emissiveIntensity = 0.4; }
        const th = Math.min(0.32, h * 0.4);
        addMesh(new THREE.BoxGeometry(w, th, d), topM, 0, h / 2 - th / 2, 0, mesh);
        addMesh(new THREE.BoxGeometry(w - 0.12, h - th, d - 0.12), sideM, 0, -th / 2, 0, mesh);
      }
      const s = { mesh, w, h, d, type: opt.type || 'solid', active: true, dx: 0, dy: 0, dz: 0 };
      solids.push(s); return s;
    },
    mover(x, top, z, w, d, axis, amp, sp, ph = 0) {
      const s = B.plat(x, top, z, w, d, { color: L.moverColor }); s.type = 'move';
      movers.push({ s, axis, amp, sp, ph, b: { x, y: top - s.h / 2, z } }); return s;
    },
    vanish(x, top, z, w, d) {
      const m = new THREE.MeshStandardMaterial({ color: L.vanishColor, roughness: 0.7, map: studTx(w, d), transparent: true });
      if (L.neon) { m.emissive = new THREE.Color(L.vanishColor); m.emissiveIntensity = 0.4; }
      const s = B.plat(x, top, z, w, d, { mat: m }); s.type = 'vanish';
      vanish.push({ s, state: 'idle', t: 0, by: s.mesh.position.y, bx: x }); return s;
    },
    pad(x, top, z, power) {
      const s = B.plat(x, top, z, 3, 3, { color: 0xffc93c }); s.type = 'pad'; s.power = power;
      const ring = new THREE.Mesh(new THREE.TorusGeometry(1, 0.12, 8, 32), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffc93c, emissiveIntensity: 0.8 }));
      ring.rotation.x = Math.PI / 2; ring.position.set(x, top + 0.15, z); LG.add(ring); decorAnim.push(t => ring.scale.setScalar(1 + Math.sin(t * 6) * 0.12));
      return s;
    },
    bounce(x, top, z, w, d, power) {
      const m = new THREE.MeshStandardMaterial({ color: L.jelly || 0x3dffb0, roughness: 0.2, transparent: true, opacity: 0.88, emissive: L.jelly || 0x3dffb0, emissiveIntensity: 0.25 });
      const s = B.plat(x, top, z, w, d, { mat: m }); s.type = 'bounce'; s.power = power; s.squash = 0; s.baseY = s.mesh.position.y; return s;
    },

    solids = []; movers = []; vanish = []; beats = []; spinners = []; fires = []; coins = []; cps = []; convs = []; parts = []; decorAnim = []; winds = []; crushers = []; bubbles = []; finishSolid = null; palI = 0;
  }
  function loadLevel(i) {
    clearLevel(); levelIdx = i; L = LEVELS[i];
    LG = new THREE.Group(); scene.add(LG);
    setSky(L.top, L.hor); scene.fog.near = L.fog[0]; scene.fog.far = L.fog[1];
    const dark = new THREE.Color(L.hor).getHSL({}).l < 0.35;
    hemi.intensity = dark ? 0.62 : 0.72; hemi.groundColor.setHex(dark ? 0x332244 : 0x8aa4c6); sun.intensity = dark ? 0.6 : 0.9;
    L.decor(); L.build();
  }
  function startLevel(i) {
    loadLevel(i);
    spawn = { x: 0, y: 0, z: 0 }; deaths = 0; gotCoins = 0; timeEl = 0; T = 0; beatPhase = -1;
    yaw = 0; pitch = 0.38; respawn(); P.facing = Math.PI;
    ['menu', 'pause', 'win'].forEach(id => $(id).classList.add('hide'));
    $('pName').textContent = (i + 1) + '. ' + L.name;
    state = 'play'; paused = false; hud(); banner(L.name, L.sub + ' · cel: ' + fmt(L.target), 2200);
    camera.position.set(0, 6, 10);
  }
  function respawn() {
    P.padFlight = false; P.x = spawn.x; P.y = spawn.y + 0.05; P.z = spawn.z; P.vx = P.vy = P.vz = 0; P.ground = null; jumpsLeft = 1;
    vanish.forEach(v => { v.state = 'idle'; v.s.active = true; v.s.mesh.position.set(v.bx, v.by, v.s.mesh.position.z); v.s.mesh.material.opacity = 1; });
  }
  function burst(x, y, z, color, n = 20, spd = 6, grav = 18) {
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), new THREE.MeshBasicMaterial({ color, transparent: true }));
      m.position.set(x, y, z); scene.add(m);
      parts.push({ m, vx: (Math.random() - 0.5) * spd * 2, vy: Math.random() * spd + 2, vz: (Math.random() - 0.5) * spd * 2, life: 0.6 + Math.random() * 0.5, max: 1.1, grav });
    }
  }
  function die() {
    deaths++; SFX.die(); burst(P.x, P.y + 1, P.z, look.color, 24); respawn(); hud();
    const f = $('flash'); f.style.opacity = 0.45; setTimeout(() => f.style.opacity = 0, 120);
    if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} }
  }

  // ---------- input ----------
  const keys = {};
  addEventListener('keydown', e => {
    if (e.repeat && e.code === 'Space') return;
    keys[e.code] = true;
    if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
    if (e.code === 'Space') jumpBuf = 0.15;
    if (e.code === 'KeyR' && state === 'play' && !paused) respawn();
    if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  });
  addEventListener('keyup', e => keys[e.code] = false);
  const joy = { id: null, x: 0, y: 0 }, joyEl = $('joy'), knob = $('knob');
  joyEl.addEventListener('pointerdown', e => { joy.id = e.pointerId; joyEl.setPointerCapture(e.pointerId); moveJoy(e); });
  joyEl.addEventListener('pointermove', e => { if (e.pointerId === joy.id) moveJoy(e); });
  const endJoy = e => { if (e.pointerId === joy.id) { joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; } };
  joyEl.addEventListener('pointerup', endJoy); joyEl.addEventListener('pointercancel', endJoy);
  function moveJoy(e) {
    const r = joyEl.getBoundingClientRect(), max = r.width / 2 - 10;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); const l = Math.hypot(dx, dy); if (l > max) { dx *= max / l; dy *= max / l; }
    joy.x = dx / max; joy.y = dy / max; knob.style.transform = `translate(${dx}px,${dy}px)`;
  }
  const jb = $('jumpBtn');
  jb.addEventListener('pointerdown', e => { e.preventDefault(); jumpBuf = 0.15; jb.classList.add('down'); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => jb.addEventListener(ev, () => jb.classList.remove('down')));
  const drag = { id: null, x: 0, y: 0 };
  canvas.addEventListener('pointerdown', e => { if (drag.id !== null) return; drag.id = e.pointerId; drag.x = e.clientX; drag.y = e.clientY; try { canvas.setPointerCapture(e.pointerId); } catch (er) {} });
  canvas.addEventListener('pointermove', e => { if (e.pointerId !== drag.id) return; yaw -= (e.clientX - drag.x) * 0.006; pitch = Math.min(1.2, Math.max(0.05, pitch + (e.clientY - drag.y) * 0.004)); drag.x = e.clientX; drag.y = e.clientY; });
  const endDrag = e => { if (e.pointerId === drag.id) drag.id = null; };
  canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('wheel', e => { camDist = Math.min(16, Math.max(5, camDist + e.deltaY * 0.01)); }, { passive: true });

  // ---------- physics ----------
  const _v = new THREE.Vector3();
  function box(s) {
    let p = s.mesh.position;
    if (s._world) { s.mesh.getWorldPosition(_v); p = _v; }
    return { x0: p.x - s.w / 2, x1: p.x + s.w / 2, y0: p.y - s.h / 2, y1: p.y + s.h / 2, z0: p.z - s.d / 2, z1: p.z + s.d / 2 };
  }
  const ov = b => P.x + R_ > b.x0 && P.x - R_ < b.x1 && P.y + PH > b.y0 && P.y < b.y1 && P.z + R_ > b.z0 && P.z - R_ < b.z1;
  function crusherY(c) {
    const f = ((T / c.period) + c.ph) % 1, up = c.floorTop + 4.6, down = c.floorTop + 0.02;
    if (f < 0.45) return up;
    if (f < 0.55) { const k = (f - 0.45) / 0.1; return up + (down - up) * k * k; }
    if (f < 0.72) return down;
    return down + (up - down) * ((f - 0.72) / 0.28);
  }

  function step(dt) {
    T += dt; timeEl += dt;
    const G = -32 * L.grav;

    movers.forEach(m => {
      const p = m.s.mesh.position, v = Math.sin(T * m.sp + m.ph) * m.amp;
      const nx = m.axis === 'x' ? m.b.x + v : m.b.x, ny = m.axis === 'y' ? m.b.y + v : m.b.y, nz = m.axis === 'z' ? m.b.z + v : m.b.z;
      m.s.dx = nx - p.x; m.s.dy = ny - p.y; m.s.dz = nz - p.z; p.set(nx, ny, nz);
    });
    vanish.forEach(v => {
      const m = v.s.mesh;
      if (v.state === 'shake') { v.t -= dt; m.position.x = v.bx + Math.sin(T * 60) * 0.06; if (v.t <= 0) { v.state = 'gone'; v.s.active = false; v.t = 2.6; m.position.x = v.bx; } }
      else if (v.state === 'gone') { v.t -= dt; m.position.y -= 9 * dt; m.material.opacity = Math.max(0, m.material.opacity - dt * 1.5); if (v.t <= 0) { v.state = 'idle'; v.s.active = true; m.position.y = v.by; m.material.opacity = 1; } }
    });
    if (beats.length) {
      const per = 1.2, ph = Math.floor(T / per) % 2, frac = (T % per) / per;
      if (ph !== beatPhase) { beatPhase = ph; SFX.tick(ph === 0); }
      beats.forEach(s => { const on = s.group === ph; s.active = on; const warn = on && frac > 0.72 && Math.floor(T * 12) % 2; s.mesh.material.opacity = on ? (warn ? 0.45 : 1) : 0.12; s.mesh.material.emissiveIntensity = on ? 0.6 : 0.15; });
    }
    spinners.forEach(s => s.g.rotation.y = T * s.sp);
    fires.forEach(f => { f.m.position.y = f.base + Math.abs(Math.sin(T * f.sp + f.ph)) * f.amp; f.m.rotation.x += dt * 3; f.m.rotation.y += dt * 2; });
    crushers.forEach(c => {
      const y = crusherY(c), f = ((T / c.period) + c.ph) % 1;
      const shake = f > 0.36 && f < 0.45 ? Math.sin(T * 70) * 0.05 : 0;
      c.g.position.set(c.x + shake, y, c.z);
      if (f >= 0.55 && c.last < 0.55 && Math.hypot(P.x - c.x, P.z - c.z) < 20) { SFX.slam(); burst(c.x, c.floorTop + 0.2, c.z, 0xd8c0a0, 8, 3); }
      c.last = f;
    });
    solids.forEach(s => { if (s.type === 'bounce' && s.squash > 0) { s.squash = Math.max(0, s.squash - dt * 4); const k = Math.sin(s.squash * Math.PI) * 0.35; s.mesh.scale.set(1 + k * 0.3, 1 - k, 1 + k * 0.3); } });

    if (P.grounded && P.ground) { P.x += P.ground.dx || 0; P.y += Math.max(0, P.ground.dy || 0); P.z += P.ground.dz || 0; }

    let f = 0, s = 0;
    if (keys.KeyW || keys.ArrowUp) f++; if (keys.KeyS || keys.ArrowDown) f--; if (keys.KeyD || keys.ArrowRight) s++; if (keys.KeyA || keys.ArrowLeft) s--;
    f -= joy.y; s += joy.x;
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
    let mx = fx * f + rx * s, mz = fz * f + rz * s; const ml = Math.hypot(mx, mz); if (ml > 1) { mx /= ml; mz /= ml; }
    const SPEED = P.padFlight ? 7 : 12, acc = P.grounded ? (L.ice ? 3.2 : 22) : (L.ice ? 5 : 10), k = 1 - Math.exp(-acc * dt);
    P.vx += (mx * SPEED - P.vx) * k; P.vz += (mz * SPEED - P.vz) * k;
    if (ml > 0.1) P.facing = Math.atan2(mx, mz);

    coyote = P.grounded ? 0.1 : coyote - dt; jumpBuf -= dt;
    if (jumpBuf > 0) {
      if (coyote > 0) { P.vy = L.jump; jumpBuf = 0; coyote = 0; P.grounded = false; jumpsLeft = 1; SFX.jump(); squash = 1; }
      else if (jumpsLeft > 0) { P.vy = L.jump * 0.92; jumpBuf = 0; jumpsLeft = 0; SFX.djump(); burst(P.x, P.y, P.z, 0xffffff, 10, 3); }
    }
    P.vy = Math.max(-40, P.vy + G * dt);
    for (const b of bubbles) if (Math.hypot(P.x - b.x, P.z - b.z) < b.r && P.y > b.y0 && P.y < b.y1) { P.vy += (b.lift - P.vy) * Math.min(1, dt * 5); jumpsLeft = 1; }
    let wx = 0, wz = 0;
    for (const w of winds) if (P.x > w.x0 && P.x < w.x1 && P.y + 1 > w.y0 && P.y < w.y1 && P.z > w.z0 && P.z < w.z1) { wx += w.fx; wz += w.fz; }

    const wasAir = !P.grounded, fallV = P.vy;
    const act = solids.filter(x => x.active);
    P.y += P.vy * dt; P.grounded = false; P.ground = null;
    for (const so of act) { const b = box(so); if (ov(b)) { if (P.vy <= 0) { P.y = b.y1; P.grounded = true; P.ground = so; jumpsLeft = 1; } else P.y = b.y0 - PH; P.vy = 0; } }
    P.x += (P.vx + wx) * dt; for (const so of act) { const b = box(so); if (ov(b)) { P.x = (P.vx + wx) > 0 ? b.x0 - R_ : b.x1 + R_; P.vx = 0; } }
    P.z += (P.vz + wz) * dt; for (const so of act) { const b = box(so); if (ov(b)) { P.z = (P.vz + wz) > 0 ? b.z0 - R_ : b.z1 + R_; P.vz = 0; } }
    if (P.grounded && wasAir && fallV < -9) { burst(P.x, P.y + 0.1, P.z, 0xffffff, 6, 2, 6); SFX.land(); squash = -1; }

    const g = P.ground;
    if (P.grounded && g) {
      if (g.type === 'pad') { P.vy = g.power; P.grounded = false; jumpsLeft = 1; P.padFlight = true; SFX.pad(); }
      else if (g.type === 'bounce') { P.vy = g.power; P.grounded = false; jumpsLeft = 1; g.squash = 1; SFX.boing(); P.padFlight = false; }
      else P.padFlight = false;
      if (g.type === 'conv') { P.x += g.cdx * g.speed * dt; P.z += g.cdz * g.speed * dt; }
      if (g.type === 'vanish') { const v = vanish.find(v => v.s === g); if (v && v.state === 'idle') { v.state = 'shake'; v.t = 0.45; SFX.crack(); } }
      if (g.type === 'cp' && g.cpIndex > (spawn.idx || 0)) {
        const p = g.mesh.position; spawn = { x: p.x, y: p.y + g.h / 2, z: p.z, idx: g.cpIndex };
        const c = cps.find(c => c.s === g); c.fm.color.setHex(0x3ddc84); c.beam.material.opacity = 0.25; SFX.cp(); banner('Checkpoint', '', 900);
        burst(p.x, p.y + 1, p.z, 0x3ddc84, 20, 5);
      }
      if (g.type === 'finish') return winLevel();
    }
    coins.forEach(c => {
      if (c.got) return;
      c.mesh.rotation.z += dt * 3; c.mesh.position.y = c.by + Math.sin(T * 3 + c.mesh.position.z) * 0.15;
      if (Math.hypot(c.mesh.position.x - P.x, c.mesh.position.y - (P.y + 1), c.mesh.position.z - P.z) < 1.3) { c.got = true; c.mesh.visible = false; gotCoins++; SFX.coin(); burst(c.mesh.position.x, c.mesh.position.y, c.mesh.position.z, 0xffc93c, 10, 3); hud(); }
    });
    for (const sp of spinners) {
      if (P.y > sp.y + 0.3 || P.y + PH < sp.y - 0.3) continue;
      const dx = P.x - sp.cx, dz = P.z - sp.cz;

        const a = sp.g.rotation.y + k2 * Math.PI / 2, ax = Math.cos(a), az = -Math.sin(a);
        const along = dx * ax + dz * az, perp = Math.abs(-dx * az + dz * ax);
        if (Math.abs(along) < sp.len + R_ && perp < 0.22 + R_ && Math.hypot(dx, dz) > 0.7) return die();
      }
    }
    for (const c of crushers) {
      const y = c.g.position.y;
      if (Math.abs(P.x - c.x) < c.w / 2 + R_ - 0.15 && Math.abs(P.z - c.z) < c.d / 2 + R_ - 0.15 && P.y + PH > y - 0.4 && P.y < y + 2.2 && y < c.floorTop + 2.6) return die();
    }
    for (const fi of fires) if (Math.hypot(fi.m.position.x - P.x, fi.m.position.y - (P.y + 1), fi.m.position.z - P.z) < 1.35) return die();
    if (P.y < L.killY) die();
  }

  function winLevel() {
    state = 'won'; SFX.win();
    [0xffc93c, 0xff4f8b, 0x33d6ff, 0x3ddc84].forEach(c => burst(P.x, P.y + 2, P.z, c, 30, 9));
    const allCoins = gotCoins === coins.length, fast = timeEl <= L.target;
    const stars = 1 + (allCoins ? 1 : 0) + (fast ? 1 : 0);
    const before = totalStars();
    const p = prog[levelIdx] || {}; p.stars = Math.max(p.stars || 0, stars); p.time = p.time ? Math.min(p.time, timeEl) : timeEl; prog[levelIdx] = p; saveProg();
    const newHat = HATS.find(h => h.need > before && h.need <= totalStars());
    banner('Meta!', '', 1200);
    setTimeout(() => {
      $('wT').textContent = stars === 3 ? 'Perfekcyjnie' : 'Ukończone';
      $('wStars').innerHTML = [0, 1, 2].map(k => `<span class="${stars > k ? 'on' : ''}" style="animation-delay:${k * 0.2}s">★</span>`).join('');
      $('wWhy').innerHTML = `<b>✓</b><span>Dotarłeś do mety</span><b>${allCoins ? '✓' : '✗'}</b><span>Monety ${gotCoins}/${coins.length}</span><b>${fast ? '✓' : '✗'}</b><span>Czas ${fmt(timeEl)} (cel ${fmt(L.target)})</span>` + (newHat ? `<b>🎁</b><span>Nowe nakrycie głowy: ${newHat.name}</span>` : '');
      const last = levelIdx === LEVELS.length - 1;
      $('nextBtn').textContent = last ? 'Koniec gry, brawo!' : 'Następny świat';
      $('nextBtn').disabled = last; $('nextBtn').style.opacity = last ? 0.6 : 1;
      $('win').classList.remove('hide');
    }, 1300);
  }

  // ---------- render ----------
  function updateBlob() {
    let top = -Infinity;
    for (const s of solids) {
      if (!s.active) continue; const b = box(s);
      if (P.x > b.x0 - 0.2 && P.x < b.x1 + 0.2 && P.z > b.z0 - 0.2 && P.z < b.z1 + 0.2 && b.y1 <= P.y + 0.15 && b.y1 > top) top = b.y1;
    }
    if (top === -Infinity) { blob.visible = false; return; }
    blob.visible = true; blob.position.set(P.x, top + 0.04, P.z);
    const h = P.y - top; blob.scale.setScalar(Math.max(0.35, 1 - h * 0.06)); blob.material.opacity = Math.max(0.1, 0.38 - h * 0.025);
  }
  function animate(dt) {
    decorAnim.forEach(fn => fn(T, dt));
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life -= dt; p.vy -= p.grav * dt; p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.m.position.z += p.vz * dt; p.m.rotation.x += dt * 6;
      p.m.material.opacity = Math.max(0, p.life / p.max * 1.5); if (p.life <= 0) { scene.remove(p.m); p.m.geometry.dispose(); p.m.material.dispose(); parts.splice(i, 1); }
    }
    avatar.position.set(P.x, P.y, P.z);
    let d = P.facing - avatar.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); avatar.rotation.y += d * Math.min(1, dt * 14);
    squash += (0 - squash) * Math.min(1, dt * 10);
    avatar.scale.set(1 - squash * 0.12, 1 + squash * 0.15, 1 - squash * 0.12);
    const hs = Math.hypot(P.vx, P.vz);
    if (P.grounded || state !== 'play') { P.walk += dt * hs * 1.3; const sw = Math.sin(P.walk) * Math.min(1, hs / 12) * 0.85; legs[0].rotation.x = sw; legs[1].rotation.x = -sw; arms[0].rotation.x = -sw; arms[1].rotation.x = sw; }
    else { legs[0].rotation.x = 0.5; legs[1].rotation.x = -0.3; arms[0].rotation.x = arms[1].rotation.x = -2.6; }
    if (state === 'menu') { yaw += dt * 0.18; avatar.rotation.y = yaw + Math.PI * 0.15 + Math.sin(T) * 0.2; }
    updateBlob();
    const ch = Math.sin(pitch) * camDist, cr = Math.cos(pitch) * camDist, dist = state === 'menu' ? 0.7 : 1;
    const tx_ = P.x + Math.sin(yaw) * cr * dist, ty = P.y + 1.6 + ch * dist, tz = P.z + Math.cos(yaw) * cr * dist, ck = 1 - Math.exp(-10 * dt);
    camera.position.x += (tx_ - camera.position.x) * ck; camera.position.y += (ty - camera.position.y) * ck; camera.position.z += (tz - camera.position.z) * ck;
    camera.lookAt(P.x, P.y + 1.4, P.z);
    sky.position.copy(camera.position);
    sun.position.set(P.x + 12, P.y + 30, P.z + 8); sun.target.position.set(P.x, P.y, P.z);
    renderer.render(scene, camera);
  }
  let lastT = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - lastT) / 1000); lastT = now;
    if (state === 'play' && !paused) { step(dt); hud(); }
    else if (!paused) T += dt;
    animate(paused ? 0 : dt);
    requestAnimationFrame(loop);
  }

  function togglePause() { if (state !== 'play') return; paused = !paused; $('pause').classList.toggle('hide', !paused); }
  function toMenu() { state = 'menu'; paused = false; ['pause', 'win'].forEach(id => $(id).classList.add('hide')); renderMenu(); $('menu').classList.remove('hide'); loadLevel(Math.min(levelIdx, LEVELS.length - 1)); spawn = { x: 0, y: 0, z: 0 }; respawn(); }
  $('resumeBtn').onclick = togglePause; $('pauseBtn').onclick = togglePause;
  $('restartBtn').onclick = () => startLevel(levelIdx); $('againBtn').onclick = () => startLevel(levelIdx);
  $('menuBtn').onclick = toMenu; $('menuBtn2').onclick = toMenu;
  $('nextBtn').onclick = () => { if (levelIdx < LEVELS.length - 1) startLevel(levelIdx + 1); };
  $('codeBtn').onclick = tryCode; $('codeIn').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') tryCode(); });
  $('codeIn').addEventListener('keyup', e => e.stopPropagation());
  $('skipBtn').onclick = () => startLevel((levelIdx + 1) % LEVELS.length);
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play' && !paused) togglePause(); });

  applyLook(); loadLevel(0); respawn(); renderMenu();
  requestAnimationFrame(loop);
})();
</script>
